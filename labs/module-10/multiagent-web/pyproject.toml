[project]
name = "multiagent-web"
version = "0.1.0"
description = "Module 4: draw a LangGraph multi-agent workflow on a canvas, configure each agent, run it and watch it progress."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # Pinned to labs/setup/requirements.txt: the versions every Module 4 lab and demo is checked against
    "python-dotenv==1.2.4",
    "pydantic==2.14.1",
    "langgraph==1.2.18",
    "langchain==1.4.7",
    "langchain-openai==1.7.3",
    "langchain-anthropic==1.7.6",
    "openai==2.54.0",
    # Held below 2.0: anthropic 1.x sends the key as x-api-key, the header the Foundry endpoint reads
    "anthropic==1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
